name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Build with xcodebuild (generates index store)
        run: |
          xcodebuild build \
            -scheme IndexStoreMCP \
            -destination 'platform=macOS' \
            -quiet

      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-output.log

      - name: Test summary
        if: always()
        run: scripts/test-summary.sh test-output.log >>"$GITHUB_STEP_SUMMARY"

      - name: Check libIndexStore floor and ceiling
        run: scripts/check-libindexstore.sh

      - name: Build release binary
        run: swift build -c release

      - name: Smoke-test release binary
        run: scripts/smoke-test.sh "$(swift build -c release --show-bin-path)/index-store-mcp"
